services:
  fastpages: &fastpages
    working_dir: /data
    environment:
        - INPUT_BOOL_SAVE_MARKDOWN=false
    build:
      context: ./_action_files
      dockerfile: ./Dockerfile
    image: fastpages-dev
    logging:
      driver: json-file
      options:
        max-size: 50m
    stdin_open: true
    tty: true
    volumes:
      - .:/data/

  converter:
    <<: *fastpages
    command: /fastpages/action_entrypoint.sh

  watcher:
    <<: *fastpages
    command: watchmedo shell-command --command /fastpages/action_entrypoint.sh --pattern *.ipynb --recursive --drop

  jekyll:
    working_dir: /data
    image: ruby:3.1
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      - .:/data/
    environment:
      - BUNDLE_PATH=/usr/local/bundle
    command: >
     bash -c "bundle install
     && bundle exec jekyll serve --host 0.0.0.0 --force_polling --trace"
